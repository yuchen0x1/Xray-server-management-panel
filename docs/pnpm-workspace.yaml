allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  # Force any vulnerable transitive postcss (pulled in by next) up to a patched
  # release — fixes GHSA-qx2v-qp2m-jg93 / CVE-2026-41305 (vulnerable < 8.5.10).
  'brace-expansion@<1.1.21': '^1.1.21'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  'js-yaml@<4.3.2': '^4.3.2'
  'postcss@<8.5.10': '^8.5.15'
  'sharp@<0.35.0': '^0.35.3'
  'vitest@<4.1.12': '^4.1.12'
  '@vitest/mocker@<4.1.12': '^4.1.12'
  'minimatch@>=7.0.0 <11.0.1': '^11.0.1'
  dompurify: ^3.4.17
  source-map-js: ^1.2.2
  vite: ^8.1.6
  katex: ^0.18.2
minimumReleaseAgeExclude:
  - '@mermaid-js/parser@1.2.0'
  - mermaid@11.16.0
